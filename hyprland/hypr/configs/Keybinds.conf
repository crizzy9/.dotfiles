# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Default Keybinds
# visit https://wiki.hyprland.org/Configuring/Binds/ for more info

$mainMod = SUPER
# Default
$scriptsDir = $HOME/.config/hypr/scripts
$configs = $HOME/.config/hypr/configs
# User
$UserConfigs = $HOME/.config/hypr/UserConfigs
$UserScripts = $HOME/.config/hypr/UserScripts

bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, Q, exec, $scriptsDir/KillActiveProcess.sh
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod ALT, F, exec, hyprctl dispatch workspaceopt allfloat
bind = CTRL ALT, L, exec, $scriptsDir/LockScreen.sh
bind = CTRL ALT, P, exec, $scriptsDir/Wlogout.sh

# FEATURES / EXTRAS
bind = $mainMod, F2, exec, $scriptsDir/KeyHints.sh # Small help file
bind = $mainMod ALT, R, exec, $scriptsDir/Refresh.sh # Refresh waybar, swaync, rofi
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh # emoji
bind = $mainMod, S, exec, $scriptsDir/RofiSearch.sh # Google search from Rofi
bind = $mainMod SHIFT, B, exec, $scriptsDir/ChangeBlur.sh # Toggle blur settings 
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh # animations ON/OFF
bind = $mainMod ALT, L, exec, $scriptsDir/ChangeLayout.sh # Toggle Master or Dwindle Layout
bind = $mainMod ALT, V, exec, $scriptsDir/ClipManager.sh # Clipboard Manager
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw # swayNC panel

# FEATURES / EXTRAS (UserScripts)
bind = $mainMod, E, exec, $UserScripts/QuickEdit.sh # Quick Edit Hyprland Settings
bind = $mainMod SHIFT, M, exec, $UserScripts/RofiBeats.sh # online music
bind = $mainMod, W, exec, $UserScripts/WallpaperSelect.sh # Select wallpaper to apply
bind = $mainMod SHIFT, W, exec, $UserScripts/WallpaperEffects.sh # Wallpaper Effects by imagemagickWW
bind = CTRL ALT, W, exec, $UserScripts/WallpaperRandom.sh # Random wallpapers

# Waybar / Bar related
bind = $mainMod, B, exec, killall -SIGUSR1 waybar # Toggle hide/show waybar 
bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh # Waybar Styles Menu
bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh # Waybar Layout Menu
bind = CTRL SHIFT, B, exec, $scriptsDir/WaybarRestart.sh # Restart Waybar

# Master Layout
bind = $mainMod CTRL, D, layoutmsg, removemaster
bind = $mainMod, I, layoutmsg, addmaster
bind = $mainMod, V, layoutmsg, cyclenext
bind = $mainMod, C, layoutmsg, cycleprev
bind = $mainMod, M, exec, hyprctl dispatch splitratio 0.3
bind = $mainMod, D, pseudo, # dwindle
bind = $mainMod CTRL, Return, layoutmsg, swapwithmaster

# group
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, tab, changegroupactive  #change focus to another window

 # Cycle windows if floating bring to top
bind = ALT,Tab,cyclenext
bind = ALT,Tab,bringactivetotop  
bind = ALT SHIFT, Tab, cyclenext, prev

# Special Keys / Hot Keys
bindel = , xf86audioraisevolume, exec, $scriptsDir/Volume.sh --inc #volume up
bindel = , xf86audiolowervolume, exec, $scriptsDir/Volume.sh --dec #volume down
bindl = , xf86AudioMicMute, exec, $scriptsDir/Volume.sh --toggle-mic #mute mic
bindl = , xf86audiomute, exec, $scriptsDir/Volume.sh --toggle
bindl = , xf86Sleep, exec, systemctl suspend  # sleep button 
bindl = , xf86Rfkill, exec, $scriptsDir/AirplaneMode.sh #Airplane mode

# media controls using keyboards
bindl = , xf86AudioPlayPause, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , xf86AudioPause, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , xf86AudioPlay, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , xf86AudioNext, exec, $scriptsDir/MediaCtrl.sh --nxt
bindl = , xf86AudioPrev, exec, $scriptsDir/MediaCtrl.sh --prv
bindl = , xf86audiostop, exec, $scriptsDir/MediaCtrl.sh --stop

# Screenshot keybindings NOTE: You may need to press Fn key as well
bind = $mainMod, Print, exec, $scriptsDir/ScreenShot.sh --now
bind = $mainMod SHIFT, Print, exec, $scriptsDir/ScreenShot.sh --area
bind = $mainMod CTRL, Print, exec, $scriptsDir/ScreenShot.sh --in5 #screenshot in 5 secs
bind = $mainMod CTRL SHIFT, Print, exec, $scriptsDir/ScreenShot.sh --in10 #screenshot in 10 secs
bind = ALT, Print, exec, $scriptsDir/ScreenShot.sh --active #take screenshot of active window

# screenshot with swappy (another screenshot tool)
bind = $mainMod SHIFT, S, exec, $scriptsDir/ScreenShot.sh --swappy

# Resize windows
binde = $mainMod SHIFT, H, resizeactive,-50 0
binde = $mainMod SHIFT, L, resizeactive,50 0
binde = $mainMod SHIFT, K, resizeactive,0 -50
binde = $mainMod SHIFT, J, resizeactive,0 50

# Move windows
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Workspaces related
# bind = $mainMod, Tab, workspace, m+1
# bind = $mainMod SHIFT, tab, workspace, m-1
bind = $mainMod, Tab, split-workspace, previous
# bind = $mainMod, Tab, workspace, previous

# Special workspace
bind = $mainMod SHIFT, U, movetoworkspace, special
bind = $mainMod, U, togglespecialworkspace,
# move back to main workspace


# needs https://github.com/Duckonaut/split-monitor-workspaces/tree/main
plugin {
  split-monitor-worspaces {
    count = 10
    keep_focused = 1
    enable_notifications = 0
    enable_persistent_workspaces = 1
  }
}

# The following mappings use the key codes to better support various keyboard layouts
# 1 is code:10, 2 is code 11, etc
# Switch workspaces with mainMod + [0-9] 
# bind = $mainMod, code:10, workspace, 1
# bind = $mainMod, code:11, workspace, 2
# bind = $mainMod, code:12, workspace, 3
# bind = $mainMod, code:13, workspace, 4
# bind = $mainMod, code:14, workspace, 5
# bind = $mainMod, code:15, workspace, 6
# bind = $mainMod, code:16, workspace, 7
# bind = $mainMod, code:17, workspace, 8
# bind = $mainMod, code:18, workspace, 9
# bind = $mainMod, code:19, workspace, 10

bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9
bind = $mainMod, 0, split-workspace, 10
bind = $mainMod, bracketleft, workspace, -1
bind = $mainMod, bracketright, workspace, +1

# Move active window and follow to workspace mainMod + SHIFT [0-9]
# bind = $mainMod SHIFT, code:10, movetoworkspace, 1
# bind = $mainMod SHIFT, code:11, movetoworkspace, 2
# bind = $mainMod SHIFT, code:12, movetoworkspace, 3
# bind = $mainMod SHIFT, code:13, movetoworkspace, 4
# bind = $mainMod SHIFT, code:14, movetoworkspace, 5
# bind = $mainMod SHIFT, code:15, movetoworkspace, 6
# bind = $mainMod SHIFT, code:16, movetoworkspace, 7
# bind = $mainMod SHIFT, code:17, movetoworkspace, 8
# bind = $mainMod SHIFT, code:18, movetoworkspace, 9
# bind = $mainMod SHIFT, code:19, movetoworkspace, 10
bind = $mainMod SHIFT, 1, split-movetoworkspace, 1
bind = $mainMod SHIFT, 2, split-movetoworkspace, 2
bind = $mainMod SHIFT, 3, split-movetoworkspace, 3
bind = $mainMod SHIFT, 4, split-movetoworkspace, 4
bind = $mainMod SHIFT, 5, split-movetoworkspace, 5
bind = $mainMod SHIFT, 6, split-movetoworkspace, 6
bind = $mainMod SHIFT, 7, split-movetoworkspace, 7
bind = $mainMod SHIFT, 8, split-movetoworkspace, 8
bind = $mainMod SHIFT, 9, split-movetoworkspace, 9
bind = $mainMod SHIFT, 0, split-movetoworkspace, 10

bind = $mainMod SHIFT, bracketleft, movetoworkspace, -1 # brackets [ or ]
bind = $mainMod SHIFT, bracketright, movetoworkspace, +1

# Move active window to a workspace silently mainMod + CTRL [0-9]
# bind = $mainMod CTRL, code:10, movetoworkspacesilent, 1
# bind = $mainMod CTRL, code:11, movetoworkspacesilent, 2
# bind = $mainMod CTRL, code:12, movetoworkspacesilent, 3
# bind = $mainMod CTRL, code:13, movetoworkspacesilent, 4
# bind = $mainMod CTRL, code:14, movetoworkspacesilent, 5
# bind = $mainMod CTRL, code:15, movetoworkspacesilent, 6
# bind = $mainMod CTRL, code:16, movetoworkspacesilent, 7
# bind = $mainMod CTRL, code:17, movetoworkspacesilent, 8
# bind = $mainMod CTRL, code:18, movetoworkspacesilent, 9
# bind = $mainMod CTRL, code:19, movetoworkspacesilent, 10

bind = $mainMod CTRL, 1, split-movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, split-movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, split-movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, split-movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, split-movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, split-movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, split-movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, split-movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, split-movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, split-movetoworkspacesilent, 10
bind = $mainMod CTRL, bracketleft, movetoworkspacesilent, -1 # brackets [ or ]
bind = $mainMod CTRL, bracketright, movetoworkspacesilent, +1

# Scroll through existing workspaces with mainMod + scroll or mainMod + N/P
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1
# bind = $mainMod, N, split-workspace, e+1
# bind = $mainMod, P, split-workspace, e-1
bind = $mainMod, mouse_down, split-cycleworkspaces, next
bind = $mainMod, mouse_up, split-cycleworkspaces, prev
bind = $mainMod, N, split-cycleworkspaces, next
bind = $mainMod, P, split-cycleworkspaces, prev

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Monitors related
# Hyprsome
# workspace=1, monitor:HDMI-A-1
# workspace=2, monitor:HDMI-A-1
# workspace=3, monitor:HDMI-A-1
# workspace=4, monitor:HDMI-A-1
# workspace=5, monitor:HDMI-A-1
# workspace=6, monitor:HDMI-A-1
# workspace=7, monitor:HDMI-A-1
# workspace=8, monitor:HDMI-A-1
# workspace=9, monitor:HDMI-A-1
# workspace=10, monitor:HDMI-A-1
#
# workspace=11, monitor:HDMI-A-2
# workspace=12, monitor:HDMI-A-2
# workspace=13, monitor:HDMI-A-2
# workspace=14, monitor:HDMI-A-2
# workspace=15, monitor:HDMI-A-2
# workspace=16, monitor:HDMI-A-2
# workspace=17, monitor:HDMI-A-2
# workspace=18, monitor:HDMI-A-2
# workspace=19, monitor:HDMI-A-2
# workspace=110, monitor:HDMI-A-2

# move window to another monitor
bind = $mainMod ALT, bracketright, split-changemonitor, next
bind = $mainMod ALT, bracketleft, split-changemonitor, prev

# move between monitors
# bind = $mainMod, asciitilde, focusmonitor, +1
# bind = $mainMod SHIFT, asciitilde, focusmonitor, -1
bind = $mainMod, Right, focusmonitor, +1
bind = $mainMod, Left, focusmonitor, -1
